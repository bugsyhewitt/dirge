[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirge"
version = "0.1.0"
description = "NoSQL injection payload generator and scanner for MongoDB, Couchbase, and Cassandra"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["nosql", "injection", "mongodb", "security", "offensive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
dirge = "dirge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dirge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
